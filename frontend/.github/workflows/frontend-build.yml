name: Validate frontend build

on:
  push:
    branches: [v4]
  pull_request:
    branches: [v4]
  workflow_dispatch: {}

concurrency:
  group: frontend-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CID_RUNTIME: node
      PUBLIC_API_BASE_URL: https://api.crimeisdown.com
      PUBLIC_PREVIEW: "false"
      PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.PUBLIC_GOOGLE_MAPS_API_KEY }}
      PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ vars.PUBLIC_MAPBOX_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
